<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 1027 289">
  <style>
    svg {
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-back: cubic-bezier(.34, 1.56, .64, 1);
    }

    svg * { transform-box: fill-box; }

    .wave-top {
      transform-origin: left center;
      animation: waveIn 1s var(--ease-out) both;
    }
    .wave-bottom {
      transform-origin: left bottom;
      animation: waveUp 1s var(--ease-out) .2s both;
    }
    .icon {
      transform-origin: center;
      animation: iconSettle 1.4s var(--ease-out) both;
    }

    .letter {
      transform-origin: center bottom;
      animation: letterRise .9s var(--ease-out) both;
      animation-delay: calc(2.05s + var(--i) * .18s);
    }

    .y-tail {
      fill: #ceff00;
      transform-origin: right bottom;
      animation: yTailReveal .75s var(--ease-back) 4.04s both;
    }

    .dot {
      transform-origin: center;
      animation:
        dotRoll 1.19s var(--ease-back) 1.4s both,
        dotPush .48s var(--ease-back) 2.59s both,
        dotGlow 1.2s ease-out 2.59s both;
    }

    .tag {
      animation: tagIn .7s var(--ease-out) both;
      animation-delay: calc(4.15s + var(--i) * .05s);
    }

    @keyframes waveIn {
      0%   { opacity: 0; transform: translateX(-40%) scaleX(.3) skewX(-20deg); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: none; }
    }
    @keyframes waveUp {
      0%   { opacity: 0; transform: translateY(35%) scale(.8) rotate(-6deg); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes iconSettle {
      0%   { transform: rotate(-4deg); }
      100% { transform: none; }
    }
    @keyframes letterRise {
      0%   { opacity: 0; transform: translateY(60%) scaleY(1.25); filter: blur(6px); }
      100% { opacity: 1; transform: none; filter: blur(0); }
    }
    @keyframes yTailReveal {
      0%   { opacity: 0; transform: translateY(28%) rotate(-8deg); }
      65%  { opacity: 1; transform: translateY(0) rotate(5deg); }
      82%  { opacity: 1; transform: rotate(-2deg); }
      100% { opacity: 1; transform: rotate(0); }
    }
    @keyframes dotRoll {
      0%   { opacity: 0; transform: translate(-420px, 100px) rotate(-540deg) scale(.72); }
      94%  { opacity: 0; transform: translate(0, 0) rotate(0) scale(.9); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes dotPush {
      0%, 100% { transform: none; }
      44% { transform: translateY(-22px) scale(1.08); }
      70% { transform: translateY(-4px) scale(.96, 1.04); }
    }
    @keyframes dotGlow {
      0%   { filter: drop-shadow(0 0 0 rgba(206,255,0,0)); }
      35%  { filter: drop-shadow(0 0 18px rgba(206,255,0,.9)); }
      100% { filter: drop-shadow(0 0 0 rgba(206,255,0,0)); }
    }
    @keyframes tagIn {
      0%   { opacity: 0; transform: translateX(-30%); filter: blur(3px); }
      100% { opacity: 1; transform: none; filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      svg * { animation: none; }
    }
      svg * { animation: none !important; }
  </style>
